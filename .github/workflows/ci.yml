name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create placeholder local.properties
        run: |
          cat > app/local.properties <<'PROPS'
          supabaseUrl=https://example.invalid
          supabaseAnonKey=ci-placeholder
          supabaseSchema=money
          powerSyncUrl=https://example.invalid
          authTempCredential=ci-placeholder
          cleartextHosts=
          PROPS

      - name: Test, lint and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
